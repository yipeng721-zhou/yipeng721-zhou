    <text x="34" y="154" fill="#1f2328"><tspan fill="#1a7f37" font-weight="bold">[ OK ]</tspan><tspan x="110">Loading</tspan><tspan x="290">analytical instruments</tspan></text>
    <text x="34" y="186" fill="#1f2328"><tspan fill="#1a7f37" font-weight="bold">[ OK ]</tspan><tspan x="110">Mounting /domain</tspan><tspan x="290">product knowledge &amp; service</tspan></text>
    <text x="34" y="218" fill="#1f2328"><tspan fill="#1a7f37" font-weight="bold">[ OK ]</tspan><tspan x="110">Mounting /agents</tspan><tspan x="290">RAG, diagnosis &amp; workflows</tspan></text>

    <text x="34" y="274" fill="#8b949e">$ _</text>
