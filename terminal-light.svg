<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="Yipeng OS terminal">
  <title>Yipeng OS — Instruments × AI, brought to life.</title>
  <defs>
    <clipPath id="win-light"><rect x="1" y="1" width="878" height="338" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#win-light)">
    <rect x="1" y="1" width="878" height="338" fill="#f6f8fa"/>
    <rect x="1" y="1" width="878" height="44" fill="#eaeef2"/>
    <line x1="1" y1="45" x2="879" y2="45" stroke="#d0d7de" stroke-width="2"/>
  </g>
  <rect x="1" y="1" width="878" height="338" rx="14" fill="none" stroke="#d0d7de" stroke-width="2"/>

  <circle cx="28" cy="23" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="23" r="6" fill="#febc2e"/>
  <circle cx="68" cy="23" r="6" fill="#28c840"/>
  <text x="440" y="28" text-anchor="middle"
